plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}
group = 'me.ichun.mods.morph'
version = '1.12.2-7.3.1'
base { archivesName = 'Morph' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(8) }
    withSourcesJar()
}
minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'MorphTester'
    useDependencyAccessTransformers = true
    extraRunJvmArguments.add('-Dfml.coreMods.load=me.ichun.mods.morph.core.MorphLoadingPlugin')
}
repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    implementation(modUtils.deobfuscate('curse.maven:ichunutil-229060:2801262').toString())
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// iChunUtil's legacy AT names an anonymous class, which JST cannot resolve.
// Keep its override as accessible as the transformed superclass method.
tasks.named('compilePatchedMcJava') {
    doFirst {
        def source = file('build/rfg/minecraft-src/java/net/minecraft/client/renderer/chunk/CompiledChunk.java')
        source.text = source.getText('UTF-8').replace('protected void setLayerUsed(', 'public void setLayerUsed(')
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: '1.12.2'
    }
}
jar {
    manifest.attributes('FMLCorePlugin': 'me.ichun.mods.morph.core.MorphLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true')
}
